{# app/apps/accounts/templates/admin/accounts/change_plan_action.html #}
{% extends "admin/base_site.html" %}


{% block content %}
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="action" value="change_plan_action">

  <p>Change plan for {{ users|length }} selected user(s):</p>
  {{ form.as_p }}

  <input type="submit" name="apply" value="Change plan">
</form>
{% endblock %}
