<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>
    <h2>Hello dear {{ username }}!</h2>
    <p>Please confirm your email by clicking the button below:</p>
    <p>
        <a href="{{ confirmation_url }}">
            Confirm Email
        </a>
    </p>
    <p>
        If the button doesn't work, you can copy and paste this full link into your browser:<br>
        <a href="{{ confirmation_url }}">{{ confirmation_url }}</a>
    </p>
    <p>
        Your confirmation token: <strong>{{ token }}</strong>
    </p>

</body>
</html>
