[project]
name = "documentsapi"
version = "0.1.0"
description = ""
authors = [
    {name = "SKM"}
]
package-mode = false
requires-python = "3.12.13"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "stripe (>=15.0.1,<16.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "boto3 (>=1.42.89,<2.0.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=25.2,<26.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "pylint-django (>=2.7.0,<3.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
