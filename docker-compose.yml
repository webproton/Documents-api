services:
  # -------------------------
  # DJANGO APPLICATION
  # -------------------------
  app:
    build: .
    container_name: documents_api_web
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app
    depends_on:
      - db
      - redis

  # -------------------------
  # POSTGRES / POSTGIS
  # -------------------------
  db:
    image: postgis/postgis:14-3.2
    container_name: documents_api_db
    restart: always
    env_file:
      - .env
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    platform: linux/amd64

  # -------------------------
  # REDIS (broker for Celery)
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: documents_api_redis
    working_dir: /app/app
    restart: always
    # ports: для именнованых можно не писать
    #   - "6379:6379"

  # -------------------------
  # CELERY WORKER
  # -------------------------
  celery:
    build: .
    container_name: documents_api_celery
    
    command: celery -A config worker -l info

    
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app

    working_dir: /app/app
    depends_on:
      - db
      - redis

  # -------------------------
  # CELERY BEAT (scheduled tasks)
  # -------------------------
  celery-beat:
    build: .
    container_name: documents_api_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app

    working_dir: /app/app
    depends_on:
      - db
      - redis

  # -------------------------
  # PGADMIN (DB UI)
  # -------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: documents_api_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

# -------------------------
# PERSISTENT VOLUMES
# -------------------------
volumes:
  postgres_data: